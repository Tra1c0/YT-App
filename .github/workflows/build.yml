name: Build YT

on:
  workflow_dispatch:
  push:
    # main publishes the latest build; a round-12 branch publishes a test build (pre-release)
    branches:
      - main
      - "r12/**"
    paths-ignore:
      - "**.md"
      - "fastlane/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/crash-check.yml"
      - ".github/workflows/signing-key.yml"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      # Becomes part of the version code, so every build installs over the previous one.
      YT_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      # the instant push to the app (UnifiedPush, e.g. ntfy): "a build is under way". The address
      # is the secret YT_PUSH_URL (copied in the app: Settings → Benachrichtigungen → App-Updates);
      # without it nothing happens. Never printed (GitHub masks it as well); a failed push never
      # fails the build. The app treats the message only as a trigger for its own check.
      - name: Push "build started" to the app
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          YT_PUSH_URL: ${{ secrets.YT_PUSH_URL }}
        run: |
          if [ -z "$YT_PUSH_URL" ]; then echo "No push address (secret YT_PUSH_URL): skipped"; exit 0; fi
          printf '{"event":"started","build":%s}' "$GITHUB_RUN_NUMBER" \
            | curl -fsS --max-time 10 -d @- "$YT_PUSH_URL" > /dev/null \
            || echo "::warning::The push to the app failed (the build goes on)"

      - uses: actions/checkout@v6
        with:
          # the docs check compares with the previous commit for its warnings
          fetch-depth: 2

      # the docs check (scripts/docs_sync.py, rules in docs/HANDOFF.md → How to work): generated
      # blocks current, every YT Kotlin file in the code map, design counts. Hard errors fail the
      # build on main; on test branches they only show as annotations. String parity runs as its
      # own step below.
      - name: Check the docs
        run: |
          if python3 -I scripts/docs_sync.py --check --no-commands; then exit 0; fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then exit 1; fi
          echo "::warning::The docs check failed (not blocking outside main)"

      - uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # The personal signing key lives in the repository secret YT_SIGNING: the keystore as
      # base64 (made by the "Create signing key" workflow; its password is fixed, the keystore
      # itself is the secret), or "password:base64" from before. A key that cannot be opened
      # does not stop the build: it is signed with a throwaway debug key and published as a
      # pre-release, so it never becomes the latest build.
      - name: Prepare signing key
        env:
          YT_SIGNING: ${{ secrets.YT_SIGNING }}
          YT_KEYSTORE_BASE64: ${{ secrets.YT_KEYSTORE_BASE64 }}
          YT_KEYSTORE_PASSWORD_OLD: ${{ secrets.YT_KEYSTORE_PASSWORD }}
        run: |
          key="$RUNNER_TEMP/yt-personal.p12"
          debug() {
            echo "::warning::$1 The APK is signed with a throwaway debug key and published as a pre-release."
            echo "SIGNED_WITH=throwaway debug key ($1)" >> "$GITHUB_ENV"
            echo "YT_DEBUG_SIGNED=true" >> "$GITHUB_ENV"
            exit 0
          }
          # a copied value may carry spaces, line breaks, backticks or invisible characters;
          # none belong to password or key
          value=$(printf '%s' "$YT_SIGNING" | tr -cd 'A-Za-z0-9+/=:-')
          if printf '%s' "$value" | grep -Eq '^([0-9A-F]{2}:){31}[0-9A-F]{2}$'; then
            debug "YT_SIGNING holds the fingerprint (the second box), not the key (the first, long box)."
          fi
          if [ -n "$value" ]; then
            case "$value" in
              *:*) pass="${value%%:*}"; b64="${value#*:}" ;;
              *) pass="yt-signing-key"; b64="$value" ;;
            esac
          elif [ -n "$YT_KEYSTORE_BASE64" ]; then
            pass="$YT_KEYSTORE_PASSWORD_OLD"
            b64=$(printf '%s' "$YT_KEYSTORE_BASE64" | tr -d ' \t\r\n')
          else
            debug "No signing key (secret YT_SIGNING)."
          fi
          printf '%s' "$b64" | base64 -d > "$key" 2>/dev/null || debug "The secret YT_SIGNING is no valid key (${#value} characters; the key is several thousand). Copy the whole first box again."
          # the build gets exactly the password that opens the key here
          if ! info=$(keytool -list -v -keystore "$key" -storepass "$pass" -alias yt 2>&1); then
            debug "The key in YT_SIGNING cannot be opened (value: ${#value} characters). Copy the whole first box of \"Create signing key\" again."
          fi
          fp=$(printf '%s\n' "$info" | grep -m1 "SHA256:" | sed 's/.*SHA256: //' || true)
          echo "YT_KEYSTORE_PATH=$key" >> "$GITHUB_ENV"
          echo "YT_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"
          echo "SIGNED_WITH=personal key (SHA-256 $fp)" >> "$GITHUB_ENV"

      # every YT string needs its German twin: a key only in values/ shows English in the German
      # app, one only in values-de/ crashes every other locale. Compared per file, by name.
      - name: Check English and German YT strings
        run: bash scripts/check-strings.sh

      # the YT unit tests (plain JVM, no Android): a failing test stops the build before anything
      # is published. The upstream tests are compiled but not run; they are not YT's to keep green.
      # On the release variant, so the release build below reuses the compiled app (AGP 9 makes
      # that task only with android.onlyEnableUnitTestForTheTestedBuildType=false; without it,
      # the debug variant is tested instead, at the cost of a second compile).
      - name: Run the YT unit tests
        run: |
          set -o pipefail
          filter=(--tests 'com.github.libretube.helpers.Yt*' --tests 'com.github.libretube.ui.yt.*')
          if ! ./gradlew :app:testReleaseUnitTest --no-daemon "${filter[@]}" 2>&1 | tee unit-tests.log; then
            grep -q "testReleaseUnitTest' not found" unit-tests.log || exit 1
            echo "::warning::No release unit test task; testing the debug variant"
            ./gradlew :app:testDebugUnitTest --no-daemon "${filter[@]}"
          fi

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-report-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          name="YT-32.1-yt.${YT_BUILD_NUMBER}.apk"
          mkdir -p out
          cp "$src" "out/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk.outputs.name }}
          path: out/${{ steps.apk.outputs.name }}

      # main: build-<run>, the latest build (unless signed with the throwaway key). Any other
      # branch: check-<run>-<commit>, a pre-release that never becomes the latest build, so the
      # crash check can test it and nobody gets it as an update.
      - name: Name the release
        id: release
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tag="build-$GITHUB_RUN_NUMBER"
            name="YT Build $GITHUB_RUN_NUMBER"
            note=""
            if [ "${YT_DEBUG_SIGNED:-}" = "true" ]; then latest=false; pre=true; else latest=true; pre=false; fi
          else
            tag="check-$GITHUB_RUN_NUMBER-${GITHUB_SHA::7}"
            name="YT test build $GITHUB_RUN_NUMBER of the branch $GITHUB_REF_NAME"
            note="Test build of the branch $GITHUB_REF_NAME, not a release: for the crash check and for trying it out."
            latest=false
            pre=true
          fi
          # the body: release-notes/next.md (what the app shows as "what is new"), the marker
          # <!-- yt-details -->, then build, commit and signer; test builds keep their note
          bash scripts/release-body.sh release-notes/next.md "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" \
            "${SIGNED_WITH:-unknown}" "$note" > "$RUNNER_TEMP/release-body.md"
          cat "$RUNNER_TEMP/release-body.md"
          {
            echo "tag=$tag"
            echo "name=$name"
            echo "note=$note"
            echo "latest=$latest"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ steps.release.outputs.latest }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          files: |
            out/${{ steps.apk.outputs.name }}
            app/build/outputs/mapping/release/mapping.txt
          fail_on_unmatched_files: false
          body_path: ${{ runner.temp }}/release-body.md

      # the instant push: "the release is out" (only for the latest build of main; a throwaway-key
      # build is a pre-release the app does not offer). Same rules as the "started" push above.
      - name: Push "build published" to the app
        if: github.ref == 'refs/heads/main' && steps.release.outputs.latest == 'true'
        continue-on-error: true
        env:
          YT_PUSH_URL: ${{ secrets.YT_PUSH_URL }}
        run: |
          if [ -z "$YT_PUSH_URL" ]; then echo "No push address (secret YT_PUSH_URL): skipped"; exit 0; fi
          printf '{"event":"published","build":%s}' "$GITHUB_RUN_NUMBER" \
            | curl -fsS --max-time 10 -d @- "$YT_PUSH_URL" > /dev/null \
            || echo "::warning::The push to the app failed (the release is out all the same)"

      # a branch keeps its last three test builds; older ones go with their tags, so the many
      # pushes of the round-12 branches do not pile up releases (crash-check fetches its build
      # when it starts, so a run that is under way keeps working)
      - name: Remove older test builds of this branch
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName,name \
            | jq -r --arg branch " of the branch $GITHUB_REF_NAME" \
              '.[] | select((.tagName | startswith("check-")) and (.name | endswith($branch))) | .tagName' \
            | sort -t- -k2,2nr | tail -n +4)
          for tag in $old; do
            echo "removing the older test build $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          done
