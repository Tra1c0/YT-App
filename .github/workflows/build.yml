name: Build YT

on:
  workflow_dispatch:
    inputs:
      full_validation:
        description: "Check all designs and Android 8/16 compatibility"
        type: boolean
        default: false
  push:
    branches: [main, "r12/**"]
    paths-ignore: ["**.md", "fastlane/**", "assets/**", ".github/workflows/signing-key.yml"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "fastlane/**", "assets/**"]

permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test APK
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.bundle.outputs.artifact }}
      full: ${{ steps.bundle.outputs.full }}
      designs: ${{ steps.bundle.outputs.designs }}
    env:
      YT_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # The personal signing key lives in the repository secret YT_SIGNING: the keystore as
      # base64 (made by the "Create signing key" workflow; its password is fixed, the keystore
      # itself is the secret), or "password:base64" from before. A key that cannot be opened
      # does not stop the build: it is signed with a throwaway debug key and published as a
      # pre-release, so it never becomes the latest build.
      - name: Prepare signing key
        env:
          YT_SIGNING: ${{ secrets.YT_SIGNING }}
          YT_KEYSTORE_BASE64: ${{ secrets.YT_KEYSTORE_BASE64 }}
          YT_KEYSTORE_PASSWORD_OLD: ${{ secrets.YT_KEYSTORE_PASSWORD }}
        run: |
          key="$RUNNER_TEMP/yt-personal.p12"
          debug() {
            echo "::warning::$1 The APK is signed with a throwaway debug key and published as a pre-release."
            echo "SIGNED_WITH=throwaway debug key ($1)" >> "$GITHUB_ENV"
            echo "YT_DEBUG_SIGNED=true" >> "$GITHUB_ENV"
            exit 0
          }
          # a copied value may carry spaces, line breaks, backticks or invisible characters;
          # none belong to password or key
          value=$(printf '%s' "$YT_SIGNING" | tr -cd 'A-Za-z0-9+/=:-')
          if printf '%s' "$value" | grep -Eq '^([0-9A-F]{2}:){31}[0-9A-F]{2}$'; then
            debug "YT_SIGNING holds the fingerprint (the second box), not the key (the first, long box)."
          fi
          if [ -n "$value" ]; then
            case "$value" in
              *:*) pass="${value%%:*}"; b64="${value#*:}" ;;
              *) pass="yt-signing-key"; b64="$value" ;;
            esac
          elif [ -n "$YT_KEYSTORE_BASE64" ]; then
            pass="$YT_KEYSTORE_PASSWORD_OLD"
            b64=$(printf '%s' "$YT_KEYSTORE_BASE64" | tr -d ' \t\r\n')
          else
            debug "No signing key (secret YT_SIGNING)."
          fi
          printf '%s' "$b64" | base64 -d > "$key" 2>/dev/null || debug "The secret YT_SIGNING is no valid key (${#value} characters; the key is several thousand). Copy the whole first box again."
          # the build gets exactly the password that opens the key here
          if ! info=$(keytool -list -v -keystore "$key" -storepass "$pass" -alias yt 2>&1); then
            debug "The key in YT_SIGNING cannot be opened (value: ${#value} characters). Copy the whole first box of \"Create signing key\" again."
          fi
          fp=$(printf '%s\n' "$info" | grep -m1 "SHA256:" | sed 's/.*SHA256: //' || true)
          echo "::add-mask::$pass"
          echo "YT_KEYSTORE_PATH=$key" >> "$GITHUB_ENV"
          echo "YT_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"
          echo "SIGNED_WITH=personal key (SHA-256 $fp)" >> "$GITHUB_ENV"

      # every YT string needs its German twin: a key only in values/ shows English in the German
      # app, one only in values-de/ crashes every other locale. Compared per file, by name.
      - name: Check English and German YT strings
        run: |
          res=app/src/main/res
          # the names of the strings and plurals in one file, in file order (none if it is missing)
          names() {
            [ -f "$1" ] || return 0
            grep -o -E '<(string|plurals) [^>]*name="[^"]+"[^>]*>' "$1" | grep -v 'translatable="false"' \
              | sed -E 's/.*name="([^"]+)".*/\1/'
          }
          failed=0
          for f in $(for p in "$res"/values/yt_*.xml "$res"/values-de/yt_*.xml; do [ -e "$p" ] && basename "$p"; done | sort -u); do
            names "$res/values/$f" > en.txt
            names "$res/values-de/$f" > de.txt
            only_en=$(comm -23 <(sort -u en.txt) <(sort -u de.txt) | tr '\n' ' ')
            only_de=$(comm -13 <(sort -u en.txt) <(sort -u de.txt) | tr '\n' ' ')
            if [ -n "$only_en" ]; then failed=1; echo "::error file=$res/values-de/$f::$f: missing in values-de: $only_en"; fi
            if [ -n "$only_de" ]; then failed=1; echo "::error file=$res/values/$f::$f: missing in values: $only_de"; fi
            if [ -z "$only_en$only_de" ]; then
              # the same order makes the two files easy to compare by eye; a different one is no error
              cmp -s en.txt de.txt || echo "::warning file=$res/values-de/$f::$f: the same names, in another order"
              echo "$f: $(wc -l < en.txt) names in both"
            fi
          done
          rm -f en.txt de.txt
          [ "$failed" = 0 ] || { echo "::error::The English and German YT strings differ (see above)"; exit 1; }

      - name: Test the input driver protocol
        run: bash scripts/tests/gesture-driver-protocol.sh

      - name: Run all app unit tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-report-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build release APK and input driver
        run: |
          ./gradlew assembleRelease --no-daemon --console=plain
          bash scripts/build-gesture-driver.sh

      - name: Collect the exact build to validate
        id: bundle
        env:
          FULL_VALIDATION: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/r12/release-candidate' || inputs.full_validation == true }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/YT-32.1-yt.${YT_BUILD_NUMBER}.apk"
          cp app/build/outputs/mapping/release/mapping.txt out/
          cp build/gesture-driver/yt-input.jar out/
          python3 - <<'META'
          import json, os
          from pathlib import Path
          Path('out/build.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'number': int(os.environ['YT_BUILD_NUMBER']),
              'signing': os.environ['SIGNED_WITH'],
              'personal': os.environ.get('YT_DEBUG_SIGNED') != 'true',
          }, indent=2) + '\n')
          META
          (cd out && sha256sum *.apk > SHA256SUMS && sha256sum *.apk mapping.txt yt-input.jar build.json > VALIDATION_SHA256SUMS)
          echo "artifact=yt-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "full=$FULL_VALIDATION" >> "$GITHUB_OUTPUT"
          if [ "$FULL_VALIDATION" = true ]; then
            echo 'designs=["standard","youtube","movo","after","side","clay","editorial","glass","pop","shapes","frost","kiesel"]' >> "$GITHUB_OUTPUT"
          else
            echo 'designs=["youtube","glass"]' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK and validation inputs
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: out/
          retention-days: 14

  gestures:
    name: Gestures (${{ matrix.design }})
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        design: ${{ fromJSON(needs.build.outputs.designs) }}
    uses: ./.github/workflows/crash-check.yml
    with:
      artifact_name: ${{ needs.build.outputs.artifact }}
      source_sha: ${{ github.sha }}
      design: ${{ matrix.design }}
      gestures: true
      test_video: true
      screens: true
      signin_probe: false
      api: "34"
      target: default

  compatibility:
    name: Compatibility (API ${{ matrix.api }}, font ${{ matrix.font_scale }})
    needs: build
    if: needs.build.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: "26"
            font_scale: "1.0"
            motion: true
          - api: "36"
            font_scale: "1.0"
            motion: true
          - api: "34"
            font_scale: "1.8"
            motion: false
    uses: ./.github/workflows/crash-check.yml
    with:
      artifact_name: ${{ needs.build.outputs.artifact }}
      source_sha: ${{ github.sha }}
      design: all
      api: ${{ matrix.api }}
      target: default
      font_scale: ${{ matrix.font_scale }}
      motion: ${{ matrix.motion }}
      gestures: false
      check_upgrades: ${{ matrix.api != '34' }}
      test_video: true
      screens: true
      signin_probe: false

  publish:
    name: Publish verified APK
    needs: [build, gestures, compatibility]
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      needs.build.result == 'success' && needs.gestures.result == 'success' &&
      (needs.compatibility.result == 'success' || needs.compatibility.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: out
      - name: Verify and name the release
        id: release
        env:
          FULL_VALIDATION: ${{ needs.build.outputs.full }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd out && sha256sum -c VALIDATION_SHA256SUMS)
          [ "$(jq -r .commit out/build.json)" = "$GITHUB_SHA" ]
          personal=$(jq -r .personal out/build.json)
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$personal" = true ] && [ "$FULL_VALIDATION" = true ]; then
            tag="build-$GITHUB_RUN_NUMBER"
            title="YT Build $GITHUB_RUN_NUMBER"
            latest=true
            prerelease=false
          else
            tag="check-$GITHUB_RUN_NUMBER-${GITHUB_SHA::7}"
            title="YT test build $GITHUB_RUN_NUMBER of the branch $GITHUB_REF_NAME"
            latest=false
            prerelease=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          {
            echo "YT build $GITHUB_RUN_NUMBER from commit $GITHUB_SHA."
            echo "Signed with: $(jq -r .signing out/build.json)."
            echo "Unit tests and emulator gesture checks passed."
            if [ "$FULL_VALIDATION" = true ]; then
              echo 'All twelve designs and Android 8/14/16 compatibility were checked.'
            else
              echo 'Preview: YouTube and Glas checked on Android 14; full design and compatibility validation is pending.'
            fi
          } > release-notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.title }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ steps.release.outputs.latest }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          body_path: release-notes.md
          files: |
            out/*.apk
            out/mapping.txt
            out/build.json
            out/SHA256SUMS
