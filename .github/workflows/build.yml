name: Build YT

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "fastlane/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/crash-check.yml"
      - ".github/workflows/signing-key.yml"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      # Becomes part of the version code, so every build installs over the previous one.
      YT_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6

      - uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # The personal signing key lives in the repository secret YT_SIGNING ("password:base64",
      # made by the "Create signing key" workflow) or in YT_KEYSTORE_BASE64 and
      # YT_KEYSTORE_PASSWORD. Without it the APK is signed with a throwaway debug key and
      # cannot update a build signed with the personal key.
      - name: Prepare signing key
        env:
          YT_SIGNING: ${{ secrets.YT_SIGNING }}
          YT_KEYSTORE_BASE64: ${{ secrets.YT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$YT_SIGNING" ]; then
            pass="${YT_SIGNING%%:*}"
            echo "::add-mask::$pass"
            printf '%s' "${YT_SIGNING#*:}" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/yt-personal.p12"
            echo "YT_KEYSTORE_PATH=$RUNNER_TEMP/yt-personal.p12" >> "$GITHUB_ENV"
            echo "YT_SIGNING_PASSWORD=$pass" >> "$GITHUB_ENV"
            fp=$(keytool -list -v -keystore "$RUNNER_TEMP/yt-personal.p12" -storepass "$pass" -alias yt | grep -m1 "SHA256:" | sed 's/.*SHA256: //')
            echo "SIGNED_WITH=personal key (SHA-256 $fp)" >> "$GITHUB_ENV"
          elif [ -n "$YT_KEYSTORE_BASE64" ]; then
            echo "$YT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yt-personal.p12"
            echo "YT_KEYSTORE_PATH=$RUNNER_TEMP/yt-personal.p12" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=personal key" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret YT_KEYSTORE_BASE64 is not set. The APK is signed with a throwaway debug key."
            echo "SIGNED_WITH=throwaway debug key (cannot update other builds)" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          YT_KEYSTORE_PASSWORD: ${{ secrets.YT_KEYSTORE_PASSWORD || env.YT_SIGNING_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          name="YT-32.1-yt.${YT_BUILD_NUMBER}.apk"
          mkdir -p out
          cp "$src" "out/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk.outputs.name }}
          path: out/${{ steps.apk.outputs.name }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YT Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            out/${{ steps.apk.outputs.name }}
            app/build/outputs/mapping/release/mapping.txt
          fail_on_unmatched_files: false
          body: |
            YT build ${{ github.run_number }} from commit ${{ github.sha }}.
            Signed with: ${{ env.SIGNED_WITH }}.
