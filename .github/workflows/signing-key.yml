name: Create signing key

# YT: makes the personal signing key once, on GitHub, and shows it as one value to paste into
# the repository secret YT_SIGNING. With it every build is signed the same way, so each new APK
# installs over the old one (no more uninstalling). A secret that holds a working key stays,
# so the key cannot be replaced by accident; a broken one gets a new key.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key:
    name: Create the personal signing key
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Create the key
        env:
          EXISTING: ${{ secrets.YT_SIGNING }}
        run: |
          # a key that is already there and opens stays: replacing it would break updates
          value=$(printf '%s' "$EXISTING" | tr -d ' \t\r\n')
          if [ -n "$value" ]; then
            case "$value" in
              *:*) pass="${value%%:*}"; b64="${value#*:}" ;;
              *) pass="yt-signing-key"; b64="$value" ;;
            esac
            if printf '%s' "$b64" | base64 -d > "$RUNNER_TEMP/old.p12" 2>/dev/null &&
              keytool -list -keystore "$RUNNER_TEMP/old.p12" -storepass "$pass" -alias yt >/dev/null 2>&1; then
              rm -f "$RUNNER_TEMP/old.p12"
              echo "## Schlüssel ist schon hinterlegt" >> "$GITHUB_STEP_SUMMARY"
              echo "Das Secret YT_SIGNING ist gesetzt und funktioniert, es wird kein neuer Schlüssel erzeugt." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            rm -f "$RUNNER_TEMP/old.p12"
            replace=yes
          fi
          # the keystore itself is the secret; its password is fixed (it would sit in the same
          # secret anyway) and the value is not masked, so it shows in the summary as it is
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/yt.p12" -alias yt \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass yt-signing-key -keypass yt-signing-key \
            -dname "CN=YT, O=Tra1c0, C=DE" >/dev/null 2>&1
          fingerprint=$(keytool -list -v -keystore "$RUNNER_TEMP/yt.p12" -storepass yt-signing-key -alias yt | grep -m1 "SHA256:" | sed 's/.*SHA256: //')
          value=$(base64 -w0 "$RUNNER_TEMP/yt.p12")
          rm -f "$RUNNER_TEMP/yt.p12"
          if [ "${replace:-}" = "yes" ]; then
            link="https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions/YT_SIGNING"
            step="öffnen (das bestehende Secret YT_SIGNING), den alten Wert durch den neuen ersetzen, „Update secret“."
          else
            link="https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions/new"
            step="öffnen. Name: \`YT_SIGNING\`, Secret: einfügen, „Add secret“."
          fi
          {
            echo "## Dein Signaturschlüssel"
            echo
            echo "1. Den ganzen Wert unten kopieren (Kopier-Symbol oben rechts am Kasten)."
            echo "2. $link $step"
            echo "3. Danach diesen Lauf löschen (oben rechts ⋯ → „Delete workflow run“), damit der Wert nirgends mehr sichtbar ist."
            echo
            echo '```'
            echo "$value"
            echo '```'
            echo
            echo "Fingerabdruck (SHA-256, nicht geheim, für die Registrierung bei Google):"
            echo
            echo '```'
            echo "$fingerprint"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
