name: Create signing key

# YT: makes the personal signing key once, on GitHub, and shows it as one value to paste into
# the repository secret YT_SIGNING. With it every build is signed the same way, so each new APK
# installs over the old one (no more uninstalling). Refuses to run when the secret exists, so
# the key cannot be replaced by accident.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key:
    name: Create the personal signing key
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Create the key
        env:
          EXISTING: ${{ secrets.YT_SIGNING }}
          EXISTING_OLD: ${{ secrets.YT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$EXISTING" ] || [ -n "$EXISTING_OLD" ]; then
            echo "## Schlüssel ist schon hinterlegt" >> "$GITHUB_STEP_SUMMARY"
            echo "Das Secret ist gesetzt, es wird kein neuer Schlüssel erzeugt." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pass=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32)
          echo "::add-mask::$pass"
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/yt.p12" -alias yt \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$pass" -keypass "$pass" \
            -dname "CN=YT, O=Tra1c0, C=DE" >/dev/null 2>&1
          fingerprint=$(keytool -list -v -keystore "$RUNNER_TEMP/yt.p12" -storepass "$pass" -alias yt | grep -m1 "SHA256:" | sed 's/.*SHA256: //')
          value="$pass:$(base64 -w0 "$RUNNER_TEMP/yt.p12")"
          rm -f "$RUNNER_TEMP/yt.p12"
          {
            echo "## Dein Signaturschlüssel"
            echo
            echo "1. Den Wert unten kopieren (Kopier-Symbol oben rechts am Kasten)."
            echo "2. https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions/new öffnen."
            echo "3. Name: \`YT_SIGNING\`, Secret: einfügen, „Add secret“."
            echo "4. Danach diesen Lauf löschen (oben rechts ⋯ → „Delete workflow run“), damit der Wert nirgends mehr sichtbar ist."
            echo
            echo '```'
            echo "$value"
            echo '```'
            echo
            echo "Fingerabdruck (SHA-256, nicht geheim, für die Registrierung bei Google):"
            echo
            echo '```'
            echo "$fingerprint"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
