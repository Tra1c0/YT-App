name: Crash check

# Starts a published build in an emulator, once per chosen design, and collects the crash log.
on:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      design:
        type: string
        default: all
      api:
        type: string
        default: "34"
      target:
        type: string
        default: default
      gpu:
        type: string
        default: swiftshader_indirect
      night:
        type: boolean
        default: true
      locale:
        type: string
        default: de-DE
      screens:
        type: boolean
        default: true
      gestures:
        type: boolean
        default: true
      test_video:
        type: boolean
        default: true
      signin_probe:
        type: boolean
        default: false
      pip:
        type: boolean
        default: false
      float:
        type: boolean
        default: false
      lock:
        type: boolean
        default: false
      video:
        type: string
        default: ""
      wait:
        type: string
        default: "5"
      check_upgrades:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      build:
        description: "Release to test: a build number (33 = build-33) or a full tag (check-12-abc1234)"
        required: true
      design:
        description: "Designs to start: a key (youtube, movo, after, side, clay, editorial, glass, pop, shapes, frost, kiesel, standard), a comma list, or all"
        required: false
        default: "all"
      night:
        description: "Dark mode"
        type: boolean
        default: true
      locale:
        description: "App locale (empty = the device's English)"
        required: false
        default: "de-DE"
      api:
        description: "Android API level of the emulator"
        required: false
        default: "34"
      target:
        description: "System image: google_apis (with Google Play services) or default (plain Android, much lighter on the emulator)"
        required: false
        default: "google_apis"
      gpu:
        description: "Emulator GPU mode: swiftshader_indirect (host, fast) or guest (software in the guest, robust)"
        required: false
        default: "swiftshader_indirect"
      signin_probe:
        description: "Also open the YouTube sign-in window and log what Google shows"
        type: boolean
        default: true
      screens:
        description: "Screenshots per design (start, player, mini player), published as the pre-release screens-<run>"
        type: boolean
        default: false
      pip:
        description: "Picture-in-picture test of the sound wave: enters PiP from a video, logs where the wave's window lands, takes screenshots"
        type: boolean
        default: false
      float:
        description: "YT's own floating player with the sound wave: Home, a held drag with screenshots and a pixel check, controls, back to the app, close on the ✕"
        type: boolean
        default: false
      lock:
        description: "Install as from a downloaded APK file and walk through the permission to show over other apps (Android 15's lock on it), with screenshots"
        type: boolean
        default: false
      # round 12; GitHub allows 25 inputs here (since December 2025, before 10)
      gestures:
        description: "Gesture checks per design: runs scripts/gestures/a.sh … e.sh with the animations on, screenshots published"
        type: boolean
        default: false
      test_video:
        description: "Put the local test video (scripts/fixtures/yt-test.mp4, 3 min, frame number burned in) on the device and open it per design; the screens then show it instead of the online video"
        type: boolean
        default: false
      video:
        description: "Online video id for the player screens (empty = jNQXAC9IVRw)"
        required: false
        default: ""
      wait:
        description: "Seconds to wait after each start (empty = 20)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  emulator:
    name: Start the app in an emulator
    runs-on: ubuntu-latest
    # three designs with the gesture checks take about 12 minutes each
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # a number is a build of main (build-<n>), anything else a full tag (check-<n>-<commit> of a branch)
      - name: Download the exact CI artifact
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}
          path: apk

      - name: Check artifact provenance
        if: inputs.artifact_name != ''
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          (cd apk && sha256sum -c VALIDATION_SHA256SUMS)
          [ "$(jq -r .commit apk/build.json)" = "$EXPECTED_SHA" ]
          echo "YT_TAG=commit-${EXPECTED_SHA::7}" >> "$GITHUB_ENV"
          mkdir -p build/gesture-driver
          cp apk/yt-input.jar build/gesture-driver/

      - name: Download the build
        if: inputs.artifact_name == ''
        env:
          GH_TOKEN: ${{ github.token }}
          YT_BUILD: ${{ inputs.build }}
        run: |
          case "$YT_BUILD" in
            *[!0-9]*) tag="$YT_BUILD" ;;
            "") echo "::error::No build given"; exit 1 ;;
            *) tag="build-$YT_BUILD" ;;
          esac
          if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::\"$YT_BUILD\" is neither a build number nor a release tag"; exit 1
          fi
          echo "YT_TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p apk
          gh release download "$tag" --pattern '*.apk' --dir apk --repo "$GITHUB_REPOSITORY"
          gh release download "$tag" --pattern 'mapping.txt' --dir apk --repo "$GITHUB_REPOSITORY" || true
          ls -la apk

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build the manual check's input driver
        if: inputs.gestures && inputs.artifact_name == ''
        run: bash scripts/build-gesture-driver.sh

      - name: Download upgrade baselines
        if: inputs.check_upgrades
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p upgrade-baselines/build-64 upgrade-baselines/stable
          gh release download check-64-37a72ac --pattern '*.apk' --dir upgrade-baselines/build-64 --repo "$GITHUB_REPOSITORY"
          gh release download --pattern '*.apk' --dir upgrade-baselines/stable --repo "$GITHUB_REPOSITORY"

      - name: Run the app
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 45
        env:
          YT_DESIGN: ${{ inputs.design }}
          YT_NIGHT: ${{ inputs.night && 'yes' || 'no' }}
          YT_LOCALE: ${{ inputs.locale }}
          YT_SIGNIN_PROBE: ${{ inputs.signin_probe && 'yes' || 'no' }}
          YT_SCREENS: ${{ inputs.screens && 'yes' || 'no' }}
          YT_PIP: ${{ inputs.pip && 'yes' || 'no' }}
          YT_LOCK: ${{ inputs.lock && 'yes' || 'no' }}
          YT_FLOAT: ${{ inputs.float && 'yes' || 'no' }}
          YT_GESTURES: ${{ inputs.gestures && 'yes' || 'no' }}
          YT_TEST_VIDEO: ${{ inputs.test_video && 'yes' || 'no' }}
          YT_VIDEO: ${{ inputs.video }}
          YT_WAIT: ${{ inputs.wait }}
          YT_CHECK_UPGRADES: ${{ inputs.check_upgrades && 'yes' || 'no' }}
        with:
          api-level: ${{ inputs.api }}
          arch: x86_64
          target: ${{ inputs.target }}
          profile: pixel_6
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu ${{ inputs.gpu }} -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            if [ "$YT_CHECK_UPGRADES" = yes ]; then bash scripts/check-upgrade.sh; fi
            bash scripts/crash-check.sh

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logs-${{ env.YT_TAG }}-${{ inputs.design }}-api${{ inputs.api }}
          path: |
            logcat-*.txt
            crash-*.txt
            dumpsys-*.txt
            anr-*.txt
            input-driver.log
            upgrade-*.json

      - name: Upload screenshots
        if: always() && (inputs.screens || inputs.gestures || inputs.test_video)
        uses: actions/upload-artifact@v6
        with:
          name: screens-${{ env.YT_TAG }}-${{ inputs.design }}-api${{ inputs.api }}
          path: screens/*.png
          if-no-files-found: warn

      # the screenshots as release files: they can be fetched like the APKs; older sets go
      - name: Publish the screenshots
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.screens || inputs.pip || inputs.lock || inputs.float || inputs.gestures || inputs.test_video)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a screenshot taken after the emulator died is empty
          find screens -name '*.png' -size -2k -delete 2>/dev/null || true
          ls screens/*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          gh release create "screens-${{ github.run_number }}" screens/*.png --repo "$GITHUB_REPOSITORY" \
            --prerelease --title "Screenshots ${{ github.run_number }} ($YT_TAG)" \
            --notes "Emulator screenshots of $YT_TAG: designs ${{ inputs.design }}, dark mode ${{ inputs.night }}."
