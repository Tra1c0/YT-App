name: Crash check

# Starts a published build in an emulator, in a chosen design, and collects the crash log.
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build number of the release to test (e.g. 31)"
        required: true
      design:
        description: "Design key to start with (youtube, movo, after, side, clay, editorial, glass, pop, shapes, frost, kiesel); empty = standard"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  emulator:
    name: Start the app in an emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk
          gh release download "build-${{ inputs.build }}" --pattern '*.apk' --dir apk --repo "$GITHUB_REPOSITORY"
          gh release download "build-${{ inputs.build }}" --pattern 'mapping.txt' --dir apk --repo "$GITHUB_REPOSITORY" || true
          ls -la apk

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Run the app
        uses: reactivecircus/android-emulator-runner@v2
        env:
          YT_DESIGN: ${{ inputs.design }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 1200
          disable-animations: true
          script: bash scripts/crash-check.sh

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logcat-build-${{ inputs.build }}-${{ inputs.design || 'standard' }}
          path: |
            logcat.txt
            crash.txt
