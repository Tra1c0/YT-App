name: Crash check

# Starts a published build in an emulator, once per chosen design, and collects the crash log.
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build number of the release to test (e.g. 33)"
        required: true
      design:
        description: "Designs to start: a key (youtube, movo, after, side, clay, editorial, glass, pop, shapes, frost, kiesel, standard), a comma list, or all"
        required: false
        default: "all"
      night:
        description: "Dark mode"
        type: boolean
        default: true
      locale:
        description: "App locale (empty = the device's English)"
        required: false
        default: "de-DE"
      api:
        description: "Android API level of the emulator"
        required: false
        default: "34"
      gpu:
        description: "Emulator GPU mode: swiftshader_indirect (host, fast) or guest (software in the guest, robust)"
        required: false
        default: "swiftshader_indirect"
      signin_probe:
        description: "Also open the YouTube sign-in window and log what Google shows"
        type: boolean
        default: true
      screens:
        description: "Screenshots per design (start, player, mini player), published as the pre-release screens-<run>"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  emulator:
    name: Start the app in an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk
          gh release download "build-${{ inputs.build }}" --pattern '*.apk' --dir apk --repo "$GITHUB_REPOSITORY"
          gh release download "build-${{ inputs.build }}" --pattern 'mapping.txt' --dir apk --repo "$GITHUB_REPOSITORY" || true
          ls -la apk

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Run the app
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        env:
          YT_DESIGN: ${{ inputs.design }}
          YT_NIGHT: ${{ inputs.night && 'yes' || 'no' }}
          YT_LOCALE: ${{ inputs.locale }}
          YT_SIGNIN_PROBE: ${{ inputs.signin_probe && 'yes' || 'no' }}
          YT_SCREENS: ${{ inputs.screens && 'yes' || 'no' }}
        with:
          api-level: ${{ inputs.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu ${{ inputs.gpu }} -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/crash-check.sh

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logcat-build-${{ inputs.build }}-${{ inputs.design }}-${{ inputs.night && 'night' || 'day' }}
          path: |
            logcat-*.txt
            crash-*.txt

      # the screenshots as release files: they can be fetched like the APKs; older sets go
      - name: Publish the screenshots
        if: always() && inputs.screens
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a screenshot taken after the emulator died is empty
          find screens -name '*.png' -size -2k -delete 2>/dev/null || true
          ls screens/*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep '^screens-' || true); do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          done
          gh release create "screens-${{ github.run_number }}" screens/*.png --repo "$GITHUB_REPOSITORY" \
            --prerelease --title "Screenshots ${{ github.run_number }} (build ${{ inputs.build }})" \
            --notes "Emulator screenshots of build ${{ inputs.build }}: designs ${{ inputs.design }}, dark mode ${{ inputs.night }}."
